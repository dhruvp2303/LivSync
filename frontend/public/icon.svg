<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B5BFF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="8" opacity="0.3" />
  
  <!-- Stylized LivSync Icon / Two connected roommate silhouettes -->
  <g filter="url(#glow)">
    <!-- Person 1 -->
    <circle cx="210" cy="190" r="44" fill="url(#primaryGrad)" />
    <path d="M140 330 C140 270, 180 250, 210 250 C240 250, 280 270, 280 330 Z" fill="url(#primaryGrad)" />
    
    <!-- Person 2 (Overlaying/Syncing) -->
    <circle cx="305" cy="190" r="44" fill="#818CF8" />
    <path d="M235 330 C235 270, 275 250, 305 250 C335 250, 375 270, 375 330 Z" fill="#818CF8" opacity="0.9" />

    <!-- Sync Link Pulsing Badge -->
    <circle cx="256" cy="245" r="24" fill="#0a0a1a" stroke="url(#primaryGrad)" stroke-width="4" />
    <path d="M246 245 L253 252 L266 239" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
